name: sabil
description: Nwasy - find what is on the street corner, starting with free drinking water.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.5.0
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.6.0
  http_parser: ^4.1.2
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # One family for Arabic and Latin (SIL Open Font License, see assets/fonts/OFL.txt).
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
