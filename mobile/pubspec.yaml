name: sabil
description: A water cooler locator app for Egypt.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.1
  http_parser: ^4.0.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  flutter_map_marker_cluster: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
