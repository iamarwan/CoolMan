<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} · Sabil admin</title>
<style>
  :root { --primary:#0F766E; --ink:#1E293B; --muted:#64748B; --line:#E2E8F0; --bg:#F8FAFC;
          --ok:#059669; --warn:#D97706; --bad:#DC2626; --info:#2563EB; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--primary); }
  header { background:var(--primary); color:#fff; }
  header .wrap { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header a { color:#fff; text-decoration:none; font-weight:600; opacity:.85; }
  header a.on, header a:hover { opacity:1; text-decoration:underline; }
  header .brand { font-weight:800; font-size:18px; opacity:1; }
  header form { margin-left:auto; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px 16px; }
  .badge { display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:#fff; color:var(--primary); font-size:12px; text-align:center; }
  h1 { font-size:22px; margin:8px 0 16px; } h2 { font-size:17px; margin:24px 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:220px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:1px 9px; border-radius:20px; font-size:12px; font-weight:700; }
  .Working { background:#D1FAE5; color:var(--ok); } .Empty { background:#FEF3C7; color:var(--warn); }
  .Broken { background:#FEE2E2; color:var(--bad); } .pending { background:#DBEAFE; color:var(--info); }
  .rejected { background:#F1F5F9; color:var(--muted); }
  button, .btn { font:inherit; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--ink);
                 padding:6px 12px; border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.danger { color:var(--bad); border-color:#FCA5A5; }
  form.inline { display:inline; margin:0; }
  input, select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; text-transform:uppercase; color:var(--muted); background:#F1F5F9; }
  .photos { display:flex; gap:10px; flex-wrap:wrap; }
  .photo { width:160px; } .photo img { width:160px; height:120px; object-fit:cover; border-radius:8px; display:block; border:1px solid var(--line); }
  .flash { padding:10px 14px; border-radius:10px; margin-bottom:14px; background:#D1FAE5; color:#065F46; }
  .flash.error { background:#FEE2E2; color:#991B1B; }
  .empty { color:var(--muted); padding:8px 0; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
{% block header %}
<header><div class="wrap">
  <span class="brand">Sabil admin</span>
  {% set total = counts.new + counts.status + counts.photos %}
  <a href="/admin/queue" class="{{ 'on' if request.url.path.startswith('/admin/queue') }}">Review queue {% if total %}<span class="badge">{{ total }}</span>{% endif %}</a>
  <a href="/admin/coolers" class="{{ 'on' if request.url.path.startswith('/admin/coolers') }}">Coolers</a>
  <a href="/admin/sponsors" class="{{ 'on' if request.url.path.startswith('/admin/sponsors') }}">Sponsors</a>
  <form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Log out</button></form>
</div></header>
{% endblock %}
<main class="wrap">
  {% if msg %}<div class="flash {{ 'error' if is_error }}">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
