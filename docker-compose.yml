services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sabil-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabil
      POSTGRES_PASSWORD: sabil_pass
      POSTGRES_DB: sabil_db
    ports:
      - "5433:5432"
    volumes:
      - sabil_pgdata:/var/lib/postgresql/data

volumes:
  sabil_pgdata:
